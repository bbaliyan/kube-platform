# Values injected by the kube-node platform Application helm.parameters block.
# Defaults here are only used when rendering locally (e.g. helm template for validation).
platformRepoURL: ""
platformRevision: main
certMode: selfsigned
clusterName: ""                 # raw cluster identifier — used to tag dynamically-provisioned storage
clusterAutoscalerEnabled: false # deploy cluster-autoscaler (CAPI cloudProvider) — off by default; opt in per-cluster
clusterApiEnabled: false        # deploy Cluster API (operator + core + AWS provider) — a prerequisite for clusterAutoscalerEnabled, since the autoscaler drives MachineDeployments
externalDnsEnabled: false      # publish every ingress-capable node's IP into *.<clusterFqdnSuffix> — required whenever ingress runs on nodes a controller creates, since Terraform cannot own that record then
nightScaleDownEnabled: false   # scale every MachineDeployment to zero on a schedule — the only way to stop workers a controller owns, since Terraform never sees those instances
nightScaleDownSchedule: "55 19 * * *"      # must fire before whatever stops the control plane; once the API server is gone nothing can scale anything
nightScaleDownTimeZone: "Australia/Sydney"
platformNodeSelector: {}        # node labels every platform component is pinned to; empty leaves placement to the scheduler
extraTags: {}                    # arbitrary tags forwarded from node-aws's extra_tags, applied to CSI-provisioned storage
# One Argo CD Application per entry (named storage-provisioner-<name>) — add
# as many backends as the cluster needs (e.g. one democratic-csi release per
# NAS pool/protocol) instead of being capped at a fixed number of slots. Set
# via platform_helm_values_object per-cluster; empty list deploys none.
#   - name: iscsi-bulk          # Application name suffix — pick something that
#                                # describes the backend, not an ordinal
#     type: democratic-csi      # aws-ebs | democratic-csi | longhorn | local-path
#     repoURL: ""                # defaults to platformRepoURL when empty
#     revision: main
#     helmValues: {}             # backend-specific values (driver connection
#                                 # details, storageClasses, replica counts —
#                                 # ignored for aws-ebs, which derives its own
#                                 # from clusterName/extraTags above)
storageProvisioners: []
ciliumOperatorReplicas: 1       # cilium-operator replica count; 1 suits single-node (chart default is 2, needs anti-affinity room to schedule both), multi-node consumers override up
gpuOperatorEnabled: false       # deploy NVIDIA GPU Operator — off by default; opt in per-cluster
hubbleEnabled: false            # enable Hubble relay/UI/metrics and the matching Grafana dashboards — off by default; opt in per-cluster (see cilium-app.yaml and observability's prometheus-app.yaml)
observabilityExtraHelmValues: {} # generic passthrough forwarded as helm.valuesObject on the observability Application, merged over platform/observability's own values.yaml (e.g. nodeExporterTolerations for a node carrying a custom taint) — set via platform_helm_values_object per-cluster
gpuOperatorHelmValues: {}       # consumer-specific values (node selector/toleration, time-slicing config, etc.) merged over this Application's own driver.enabled: true default
clusterFqdnSuffix: ""
trustedCaPemB64: ""
traefikExtraConfig: {}          # traefikExtraConfig.ports entries are merged into traefik's ports block (web/websecure are always present)

# argocd-application-controller's memory limit (see argocd-app.yaml). Default
# matches the cluster-1 measurement this project was originally calibrated
# against; a cluster whose workload tree is larger should raise this via
# platform_extra_helm_parameters rather than the platform-wide default
# changing for everyone.
argocdControllerMemoryLimit: "1Gi"

# Whether this cluster has exactly one node — set per-cluster via the existing
# platform_extra_helm_parameters escape hatch (no new Terraform variable
# needed). Controls cordon/drain on the RKE2 server upgrade Plan; see
# platform/system-upgrade-plans/values.yaml for why.
singleNodeCluster: false

# Hostname whose TLS certificate should be verified against the trustedCaPemB64
# CA instead of the repo-server's bundled public CAs — needed when Argo CD syncs
# repos over HTTPS from a git server with an internally-issued certificate (the
# repo-server does not read the node OS trust store). Rendered into
# argocd-tls-certs-cm; selfHeal re-asserts it if an Argo CD reinstall resets the
# default. Leave empty when all HTTPS git hosts have publicly-trusted
# certificates. CAUTION: a configured cert REPLACES system trust for that host —
# setting this for a host that actually serves a publicly-trusted certificate
# breaks verification for it. Verify what the server serves first:
#   openssl s_client -connect <host>:443 -servername <host> -showcerts
argocdTlsCertHostname: ""

# Secret store wiring for private workload repo access.
# Leave secretStoreType empty for clusters with no private repos — ESO is not deployed.
secretStoreType: ""   # vault | aws-ssm | azure-keyvault

# URL prefix used by Argo CD repo-creds credential template matching. All repos
# whose URL starts with this prefix use the fetched credential.
# HTTPS prefix (e.g. "https://git.example.com/"): the secret store holds a token
# (GitLab deploy token or equivalent) and repoCredsUsername must be set.
# SSH prefix (e.g. "git@git.example.com:"): the secret store holds a private key.
repoCredsUrlPrefix: ""

# Username paired with the fetched token for HTTPS repo access (e.g. the GitLab
# deploy token username). Not a secret. Required when repoCredsUrlPrefix is https.
repoCredsUsername: ""

# Vault backend (secretStoreType: vault)
vaultAddr: ""         # e.g. http://192.168.1.20:8200
vaultRole: ""         # Vault Kubernetes auth role bound to ESO's service account
vaultAuthMountPath: "kubernetes"   # Vault/OpenBao Kubernetes-auth mount path this cluster was registered under
vaultSecretPath: ""   # Full KV v2 path e.g. secret/data/kube/cluster-1/repo-cred

# AWS SSM backend (secretStoreType: aws-ssm), and the region the AWS Cluster API
# provider provisions machines in when clusterApiEnabled is true.
awsRegion: ""         # e.g. eu-west-1
ssmParameterPath: ""  # e.g. /kube/cluster-1/repo-cred

# Azure Key Vault backend (secretStoreType: azure-keyvault)
azureKeyVaultUrl: ""  # e.g. https://my-kv.vault.azure.net
azureTenantId: ""     # e.g. 00000000-0000-0000-0000-000000000000
azureSecretName: ""   # Name of the Key Vault secret

# ClusterIssuer name used for all cert-manager Certificate resources in this cluster.
# Must match what workloads (ng-workloads) reference in their Certificate issuerRef.
# Default "platform-issuer" suits the selfsigned mode; set to "org-ca-issuer" for byo.
pkiIssuerName: platform-issuer

# BYO CA (certMode: byo) — paths to the CA cert, chain, and key in the secret store.
# tls.crt is built as cert+chain so cert-manager propagates the full intermediate
# chain into every issued cert, preventing PartialChain errors on TLS clients.
# AWS SSM: three separate SecureString parameters.
ssmByoCaCertPath: ""    # signing cert (must match the key)
ssmByoCaChainPath: ""   # parent chain above the signing cert
ssmByoCaKeyPath: ""     # private key
# Vault: one KV v2 secret with cert, chain, and key properties.
vaultByoCaPath: ""      # e.g. secret/data/kube/cluster-1/byo-ca
# Azure Key Vault: three separate secrets.
azureByoCaCertName: ""
azureByoCaChainName: ""
azureByoCaKeyName: ""
