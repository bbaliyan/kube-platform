# Cilium values only for the boot render (bootstrap/rendered/cilium.yaml), on
# top of cilium-values.yaml. The first boot needs just enough CNI for the node
# to become Ready. The Application sets the rest.
operator:
  # The chart default of 2 replicas stays Pending on a single node.
  replicas: 1
# Hubble's TLS secrets get a new certificate authority on every render, which
# breaks a stable render. The first boot does not need flow observability.
hubble:
  enabled: false
