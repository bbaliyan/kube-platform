# configs.cm timeouts: how soon an Application whose comparison failed is
# compared again. The default two minutes plus jitter was most of a new
# cluster's bring-up time.
# server.insecure: TLS terminates upstream; Argo CD serves plain HTTP.
configs:
  cm:
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 10s
  params:
    server.insecure: "true"
# The chart sets no resources. Requests are what a small cluster uses
# steadily, limits the peak of rendering and syncing large charts. No CPU
# limits, which would only throttle manifest generation and syncs. The
# probes' upstream 1s timeout fails under brief CPU contention.
controller:
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 2Gi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
repoServer:
  # Argo CD doesn't size Go's heap from the container limit; this is 90% of it.
  env:
    - name: GOMEMLIMIT
      value: 920MiB
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
redis:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 256Mi
applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
notifications:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
dex:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # The copyutil init container copies the ~240 MB argocd binary into
  # dex's pod, and the dirty pages that copy leaves count against its
  # memory. It otherwise inherits dex's limit above and is sometimes
  # OOMKilled on first start (seen in CI's e2e), succeeding on retry.
  initImage:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 512Mi
