{{- if .Values.clusterAutoscalerEnabled }}
{{- if ne .Values.clusterAutoscalerCloudProvider "aws" }}
{{- fail "clusterAutoscalerCloudProvider must be aws" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: {{ .Values.clusterAutoscalerVersion | quote }}
    helm:
      valuesObject:
        cloudProvider: {{ .Values.clusterAutoscalerCloudProvider }}
        autoDiscovery:
          clusterName: {{ required "clusterName must be set" .Values.clusterName | quote }}
        awsRegion: {{ required "awsRegion must be set for the aws cloud provider" .Values.awsRegion | quote }}
        extraArgs:
          expander: least-waste
          # The chart defaults to 4, which logs every step of the loop it runs
          # every 10 seconds. 2 keeps the scale-up and scale-down decisions.
          v: 2
          {{- with .Values.clusterAutoscalerCoresTotal }}
          cores-total: {{ . | quote }}
          {{- end }}
          {{- with .Values.clusterAutoscalerMemoryTotal }}
          memory-total: {{ . | quote }}
          {{- end }}
        {{- include "platform.nodeSelector" . | nindent 8 }}
        priorityClassName: system-cluster-critical
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cluster-autoscaler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
