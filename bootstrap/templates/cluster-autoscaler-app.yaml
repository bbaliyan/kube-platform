{{- if .Values.clusterAutoscalerEnabled }}
{{- if not (has .Values.clusterAutoscalerCloudProvider (list "aws" "clusterapi")) }}
{{- fail "clusterAutoscalerCloudProvider must be aws or clusterapi" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: {{ .Values.clusterAutoscalerVersion | quote }}
    helm:
      valuesObject:
        cloudProvider: {{ .Values.clusterAutoscalerCloudProvider }}
        autoDiscovery:
          clusterName: {{ required "clusterName must be set" .Values.clusterName | quote }}
{{- if eq .Values.clusterAutoscalerCloudProvider "aws" }}
        awsRegion: {{ required "awsRegion must be set for the aws cloud provider" .Values.awsRegion | quote }}
{{- else }}
        clusterAPIMode: incluster-incluster
        clusterAPICloudConfigPath: ""
        # Scaling a group from zero reads its infrastructure machine template.
        rbac:
          additionalRules:
            - apiGroups: [infrastructure.cluster.x-k8s.io]
              resources: ["*"]
              verbs: [get, list, watch]
{{- end }}
        extraArgs:
          expander: least-waste
          {{- with .Values.clusterAutoscalerCoresTotal }}
          cores-total: {{ . | quote }}
          {{- end }}
          {{- with .Values.clusterAutoscalerMemoryTotal }}
          memory-total: {{ . | quote }}
          {{- end }}
        {{- include "platform.nodeSelector" . | nindent 8 }}
        priorityClassName: system-cluster-critical
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cluster-autoscaler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
