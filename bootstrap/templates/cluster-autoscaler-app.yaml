{{- if .Values.clusterAutoscalerEnabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: {{ .Values.clusterAutoscalerVersion | quote }}
    helm:
      valuesObject:
        cloudProvider: clusterapi
        autoDiscovery:
          clusterName: {{ .Values.clusterName | quote }}
        clusterAPIMode: incluster-incluster
        clusterAPICloudConfigPath: ""
        extraArgs:
          expander: least-waste
        {{- include "platform.nodeSelector" . | nindent 8 }}
        priorityClassName: system-cluster-critical
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cluster-autoscaler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
