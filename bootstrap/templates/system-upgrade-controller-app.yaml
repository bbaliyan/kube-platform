apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    # Vendored copy of upstream's manifests (see platform/system-upgrade-controller/)
    # rather than pointing straight at rancher/system-upgrade-controller.git: their
    # raw manifests need a Kustomize namespace transform to be valid on their own,
    # and pin a stale image tag independent of the release tag. Vendoring means a
    # version bump requires manually re-copying those files from the new upstream
    # tag, with the same two fixes re-applied.
    repoURL: {{ .Values.platformRepoURL }}
    targetRevision: {{ .Values.platformRevision }}
    path: platform/system-upgrade-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
