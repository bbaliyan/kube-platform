apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/rancher/system-upgrade-controller.git
    targetRevision: v0.20.1
    path: .
    kustomize:
      # Upstream's root kustomization.yaml still applies for the namespace
      # transformer (it fills in subjects[].namespace on the ClusterRoleBindings,
      # which manifests/clusterrolebinding.yaml omits — required for kubectl
      # server-side validation). But that kustomization.yaml also pins
      # images[].newTag to a stale v0.14.0, independent of targetRevision.
      # Override it here so the deployed image always matches targetRevision.
      images:
        - rancher/system-upgrade-controller:v0.20.1
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
