{{- if .Values.gpuOperatorEnabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://helm.ngc.nvidia.com/nvidia
    chart: gpu-operator
    targetRevision: {{ .Values.gpuOperatorVersion | quote }}
    helm:
      # Consumer-specific values (node selector/toleration so the operator's
      # DaemonSets target only GPU-labeled nodes, time-slicing/MPS config,
      # etc.) are merged over these defaults here rather than passed as a
      # separate valuesObject: Argo CD uses valuesObject instead of values
      # when both are set, which would silently drop the defaults.
      {{- $defaults := `
      driver:
        enabled: true
      dcgmExporter:
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: prometheus
      ` | fromYaml }}
      valuesObject:
        {{- mustMergeOverwrite $defaults (.Values.gpuOperatorHelmValues | default dict) | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
