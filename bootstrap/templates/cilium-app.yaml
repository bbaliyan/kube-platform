{{- define "platform.ciliumOverlay" -}}
# Chart default is false: a ConfigMap-only change (any value below)
# otherwise never reaches the already-running agent — it sits
# silently applied in the ConfigMap while cilium-agent keeps running
# with its original flags, only surfacing as a "Mismatch found"
# config-drift-checker warning in the agent's own logs, not as
# anything Argo CD or kubectl rollout status would ever flag (no pod
# template diff is produced without this, so there's nothing for the
# DaemonSet controller to roll). True makes every sync here
# authoritative at the cost of a brief dataplane restart per node on
# each Cilium config change — acceptable on this project's
# single-node primary target, and no worse than any other DaemonSet
# config rollout on a multi-node one.
rollOutCiliumPods: true
# Node IPAM LB is this platform's LoadBalancer mechanism on every
# provider (replaced MetalLB). It advertises the node's own IP into a
# LoadBalancer Service's status; the node IP is natively routable on a
# Proxmox LAN and inside an AWS VPC alike, and Cilium's eBPF datapath
# (kubeProxyReplacement in cilium-values.yaml) forwards to the backend pods — no ARP,
# no BGP, no cloud API, no extra component. defaultLBServiceIPAM makes
# every LoadBalancer Service use it without needing a per-Service
# loadBalancerClass (which would be immutable and force Service
# recreation), so Traefik's Service is picked up unchanged. On a
# multi-node cluster the Service is published with the IPs of the nodes
# running a backend pod (Traefik runs on the platform node with
# externalTrafficPolicy: Local); consumers front those with DNS.
nodeIPAM:
  enabled: true
defaultLBServiceIPAM: nodeipam
# Requests only on the agent and Envoy: a memory limit would let the kernel
# kill a node's datapath.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
envoy:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
# cilium-operator's chart default is 2 replicas with pod anti-affinity. On a
# single-node cluster the second replica stays Pending, because both request
# the same hostPorts. The boot render sets 1 replica, but selfHeal would revert
# it to 2, so this Application sets it too. ciliumOperatorReplicas defaults to 1;
# a multi-node cluster raises it.
operator:
  replicas: {{ .Values.ciliumOperatorReplicas }}
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 512Mi
{{- if .Values.hubbleEnabled }}
  # cilium-operator's own metrics (port 9963) — separate from both
  # cilium-agent's below and hubble.metrics below; the Cilium Metrics
  # dashboard (cilium-dashboard.json) reads panels sourced from all
  # three, so it stays empty unless each ServiceMonitor exists.
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
{{- end }}
{{- if .Values.hubbleEnabled }}
# cilium-agent's own core metrics (drops/forwards/policy/endpoints/BPF
# map pressure, port 9962) — what the Cilium Metrics dashboard
# (cilium-dashboard.json) actually plots. Distinct from hubble.metrics
# below (Hubble flow metrics, port 9965, backs the Hubble dashboard
# instead) — enabling only one leaves the other dashboard empty.
#
# The dashboard's kvstore panels stay empty regardless of anything
# here — this platform runs identityAllocationMode: crd (the chart
# default, no kvstore: set), so there is no etcd/consul backend for
# those metrics to ever report on. bpf_syscall_duration_seconds is
# the one dashboard metric that's genuinely opt-in (a per-syscall
# histogram, disabled by default for cost) rather than just idle —
# enabled explicitly here for the "# system calls"/"system call
# latency" panels. Must be the FULL metric name including the
# "cilium_" namespace, not the short form the upstream metrics docs
# table uses — cilium-agent's --metrics flag parser looks up each
# entry by the metric's ConfigName verbatim (pkg/metrics/registry.go),
# which for this one is "cilium_bpf_syscall_duration_seconds"; a
# non-matching name is silently ignored (no error, no log), so a
# wrong short-form value looks identical to a working one until you
# check cilium-dbg metrics list on the agent itself.
prometheus:
  enabled: true
  metrics:
    - "+cilium_bpf_syscall_duration_seconds"
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
# Hubble's local per-node observer (hubble.enabled) is already on by
# the chart's own default — only relay (cluster-wide flow
# aggregation) and ui are opt-in. metrics.serviceMonitor carries the
# "release: prometheus" label because kube-prometheus-stack's
# Prometheus only scrapes ServiceMonitors bearing that label by
# default (serviceMonitorSelectorNilUsesHelmValues) — this
# Application's own release name is "prometheus" (see
# observability/templates/prometheus-app.yaml's fullnameOverride).
hubble:
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 256Mi
  ui:
    enabled: true
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
  metrics:
    enableOpenMetrics: true
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - "httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction"
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
{{- end }}
{{- end }}
{{- define "platform.ciliumValues" -}}
{{- $shared := .Files.Get "cilium-values.yaml" | fromYaml -}}
{{- $overlay := include "platform.ciliumOverlay" . | fromYaml -}}
{{ mustMergeOverwrite $shared $overlay | toYaml }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    kube-stack/keep-resources-on-delete: is the cluster network, and removing it cuts every node off
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    # The first boot installs bootstrap/rendered/cilium.yaml, a `helm template`
    # of this chart at this version with cilium-values.yaml and
    # cilium-boot-values.yaml (make boot-renders). This Application adopts
    # those resources through ServerSideApply below, with no reinstall and no
    # dataplane disruption. Bumping ciliumVersion in
    # platform/platform-versions/values.yaml upgrades Cilium. The version is
    # templated from there, not edited here. The values shared with the boot
    # render are in cilium-values.yaml.
    targetRevision: {{ .Values.ciliumVersion | quote }}
    helm:
      values: |
{{ include "platform.ciliumValues" . | indent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # No CreateNamespace=true — kube-system always exists. ServerSideApply
      # is what lets this Application adopt the already-running boot
      # cilium-operator/cilium objects (no prior Argo CD tracking on them)
      # without deleting and recreating anything.
      - ServerSideApply=true
