{{- if .Values.secretStoreType }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-repo-creds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    kube-stack/keep-resources-on-delete: holds the repository credentials Argo CD syncs with
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  source:
    repoURL: {{ .Values.platformRepoURL | quote }}
    targetRevision: {{ .Values.platformRevision | quote }}
    path: platform/argocd-repo-creds
    helm:
      parameters:
        - name: secretStoreType
          value: {{ .Values.secretStoreType | quote }}
        - name: repoCredsUrlPrefix
          value: {{ .Values.repoCredsUrlPrefix | quote }}
        - name: repoCredsUsername
          value: {{ .Values.repoCredsUsername | quote }}
        - name: awsRegion
          value: {{ .Values.secretStoreRegion | default .Values.awsRegion | quote }}
        - name: awsPodIdentity
          value: {{ ternary "true" "false" (ne (include "platform.awsRole" (dict "root" . "role" "externalSecrets")) "") | quote }}
        - name: ssmParameterPath
          value: {{ .Values.ssmParameterPath | quote }}
        - name: azureKeyVaultUrl
          value: {{ .Values.azureKeyVaultUrl | quote }}
        - name: azureTenantId
          value: {{ .Values.azureTenantId | quote }}
        - name: azureSecretName
          value: {{ .Values.azureSecretName | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
