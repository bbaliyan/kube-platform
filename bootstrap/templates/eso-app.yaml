{{/* On every cluster: the platform generates secrets with it as well as fetching them. */}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
    targetRevision: "2.10.0"
    helm:
      valuesObject:
        global:
          {{- include "platform.nodeSelector" . | nindent 10 }}
        priorityClassName: platform
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi
        webhook:
          priorityClassName: platform
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
        certController:
          priorityClassName: platform
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
