apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # Self-management: Argo CD reconciling its own installation. Genesis
    # (node-bootstrap's rendered cloud-init) installs *a* working pinned
    # version of this same chart via `helm template` (never RKE2's HelmChart
    # CRD) purely to get a running Argo CD; it does not need to match this
    # targetRevision. From here on, bumping
    # platform/platform-versions/values.yaml's argocdVersion is how you
    # upgrade Argo CD itself — an ordinary in-place Helm upgrade, not a risky
    # swap, so no adoption subtlety beyond ServerSideApply below. A rolling
    # update keeps the controller performing the sync alive until its
    # replacement is Ready, the same as any other self-managed Argo CD
    # install. targetRevision is templated from that single source of truth
    # (via the bootstrap chart's own multi-source Application, see
    # kube-compute's node-bootstrap platform_app_yaml), not edited here
    # directly.
    targetRevision: {{ .Values.argocdVersion | quote }}
    helm:
      values: |
        configs:
          # Also how soon an Application whose comparison failed is compared
          # again. On a new cluster that is every Application waiting on repo
          # credentials or a CRD from another one, and the default two minutes
          # plus up to one of jitter was most of the bring-up time. Keep equal
          # to the genesis render's values in kube-image.
          cm:
            timeout.reconciliation: 30s
            timeout.reconciliation.jitter: 10s
          params:
            # Deliberate: TLS terminates upstream (ingress / load balancer); Argo CD serves plain HTTP behind it.
            server.insecure: "true"
        global:
          {{- include "platform.placement" . | nindent 10 }}
        # The chart sets no resources. Requests are what a small cluster uses
        # steadily, limits the peak of rendering and syncing large charts. No CPU
        # limits, which would only throttle manifest generation and syncs. The
        # probes' upstream 1s timeout fails under brief CPU contention.
        controller:
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: {{ .Values.argocdControllerMemoryLimit | quote }}
          readinessProbe:
            timeoutSeconds: 5
            failureThreshold: 5
        repoServer:
          # Argo CD doesn't size Go's heap from the container limit; this is 90% of it.
          env:
            - name: GOMEMLIMIT
              value: 920MiB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          readinessProbe:
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            timeoutSeconds: 5
            failureThreshold: 5
        server:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
        redis:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
        applicationSet:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
        notifications:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        dex:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # No CreateNamespace=true — genesis already created the argocd
      # namespace. ServerSideApply is what lets this Application adopt
      # genesis's already-running resources (no prior Argo CD tracking on
      # them) without deleting and recreating anything.
      - ServerSideApply=true
