{{- define "platform.argocdValues" -}}
{{- $values := .Files.Get "argocd-values.yaml" | fromYaml -}}
{{- $_ := mustMergeOverwrite $values.configs (deepCopy (.Values.argocdExtraConfigs | default dict)) -}}
{{- with .Values.argocdControllerMemoryLimit }}{{ $_ := set $values.controller.resources.limits "memory" . }}{{ end -}}
{{- $_ := set $values "global" (include "platform.placement" . | fromYaml) -}}
{{ toYaml $values }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    kube-stack/keep-resources-on-delete: Argo CD manages its own install, so a cascade would remove the controller that runs the delete
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
{{- if .Values.workloadsRepoURL }}
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: {{ .Values.argocdVersion | quote }}
      helm:
        {{- include "platform.workloadsValueFile" "argocd" | nindent 8 }}
        values: |
{{ include "platform.argocdValues" . | indent 10 }}
    - {{ include "platform.workloadsSource" . | indent 6 | trim }}
{{- else }}
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # Self-management: Argo CD reconciling its own installation. A node's
    # first boot applies bootstrap/rendered/argocd.yaml from the platform ref
    # server-side, purely to get a running Argo CD. That manifest is rendered
    # from the same chart and bootstrap/argocd-values.yaml (make boot-renders). From here on, bumping
    # platform/platform-versions/values.yaml's argocdVersion upgrades Argo CD:
    # an ordinary in-place Helm upgrade. A rolling update keeps the controller
    # performing the sync alive until its replacement is Ready. targetRevision
    # is templated from that single source of truth, not edited here.
    targetRevision: {{ .Values.argocdVersion | quote }}
    helm:
      values: |
{{ include "platform.argocdValues" . | indent 8 }}
{{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # No CreateNamespace=true — the bootstrap manifest already created the
      # argocd namespace. ServerSideApply is what lets this Application adopt
      # the resources that manifest applied (no prior Argo CD tracking on
      # them) without deleting and recreating anything.
      - ServerSideApply=true
