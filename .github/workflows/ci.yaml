# Checks what a PR would change on the clusters that track this repo before
# it merges: they sync main straight away, so a bad merge reaches them all.
# It also runs on every push to main, so main's commits carry a status too.
#
#   render: renders the platform for each example cluster in ci/clusters/
#           the way Argo CD would (every Application, all the way down),
#           posts the rendered diff against main as a PR comment, and
#           validates the result against Kubernetes and CRD schemas.
#   e2e:    builds a kind cluster the way a node's genesis does, points Argo
#           CD at this commit, and waits for the platform to sync and come
#           up healthy. See ci/e2e/.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.2.1
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: v0.33.0
  # Must be on the same minor as k8sVersion in platform-versions; the e2e
  # job fails when they drift apart.
  # renovate: datasource=docker depName=kindest/node
  KIND_NODE_VERSION: v1.37.0

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - run: pip install --quiet pyyaml

      - name: Kubernetes version the clusters run
        # k8sVersion in platform-versions, so a Renovate bump of it renders
        # and validates against the new version.
        run: |
          python -c "import yaml; print('KUBE_VERSION=' + yaml.safe_load(open('platform/platform-versions/values.yaml'))['k8sVersion'].lstrip('v').split('+')[0])" >> "$GITHUB_ENV"

      - name: Render this branch
        id: head
        run: python ci/render.py . out/head

      - name: Render main
        id: base
        if: github.event_name == 'pull_request'
        # A main that no longer renders (say, an upstream chart version was
        # pulled) shouldn't block the PR; the comment says so instead. Only a
        # complete render is kept, so a partial one can't pose as the base.
        continue-on-error: true
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git worktree add -q ../base "$BASE"
          # Render both sides with this branch's ci/ (scripts and example
          # clusters), so a change to the harness itself doesn't show up as
          # a manifest diff.
          rm -rf ../base/ci
          cp -r ci ../base/ci
          python ci/render.py ../base out/base.tmp
          mv out/base.tmp out/base

      - name: Comment the rendered diff on the PR
        # Before validation, so a PR that fails it still shows what it
        # changes. A fork's PR gets a read-only token, so it reads the diff
        # in the job summary instead.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.head.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          python ci/diff_comment.py out/base out/head comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          [ "$SAME_REPO" = true ] || exit 0
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- rendered-manifests-diff -->"))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Validate against Kubernetes and CRD schemas
        if: ${{ !cancelled() && steps.head.outcome == 'success' }}
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          # Custom resources are checked against the CRDs the charts being
          # deployed ship, converted by kubeconform's own script. The CRDs
          # catalog, pinned, covers the system-upgrade-controller Plans, whose
          # CRD the controller installs itself. Every other missing schema
          # fails the check rather than being skipped.
          mkdir schemas
          curl -sSfL "https://raw.githubusercontent.com/yannh/kubeconform/${KUBECONFORM_VERSION}/scripts/openapi2jsonschema.py" -o openapi2jsonschema.py
          find "$PWD/out/head" -name 'CustomResourceDefinition_*.yaml' -print0 \
            | (cd schemas && FILENAME_FORMAT='{fullgroup}-{kind}_{version}' xargs -0 python ../openapi2jsonschema.py >/dev/null)
          ./kubeconform -strict -summary -output text \
            -kubernetes-version "$KUBE_VERSION" \
            -skip CustomResourceDefinition,ClusterSecretStore \
            -schema-location default \
            -schema-location 'schemas/{{.Group}}-{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            out/head

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rendered-manifests
          path: out/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The commit checked out: on a PR, the PR merged into main, the same
      # one render tests. Argo CD fetches it from GitHub itself, which
      # serves it from the PR's merge ref even when the PR comes from a fork.
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create a kind cluster
        run: |
          k8s=$(yq '.k8sVersion' platform/platform-versions/values.yaml)
          case "$k8s" in "${KIND_NODE_VERSION%.*}".*) ;; *)
            echo "::error::kindest/node $KIND_NODE_VERSION is not on the minor of k8sVersion $k8s"
            exit 1 ;;
          esac
          base="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          curl -sSfLO "$base/kind-linux-amd64" -O "$base/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          install kind-linux-amd64 kind
          ./kind create cluster --config ci/e2e/kind-config.yaml \
            --image "kindest/node:${KIND_NODE_VERSION}" --wait 0s

      - name: Genesis install of Cilium and Argo CD
        # What a node's first boot installs before Argo CD takes over: both
        # charts applied as plain manifests. On a PR, at main's versions, so
        # a version bump is tested as the upgrade it is on every cluster.
        # kind's own local-path provisioner goes, so the platform's is the
        # only one.
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch -q --depth 1 origin "$BASE"
            git show FETCH_HEAD:platform/platform-versions/values.yaml > genesis-versions.yaml
          else
            cp platform/platform-versions/values.yaml genesis-versions.yaml
          fi
          helm template cilium cilium --repo https://helm.cilium.io/ \
              --version "$(yq '.ciliumVersion' genesis-versions.yaml)" \
              --namespace kube-system --include-crds -f ci/e2e/genesis-cilium.yaml \
            | kubectl apply --server-side -f - >/dev/null
          kubectl wait --for=condition=Ready node --all --timeout=5m
          kubectl delete storageclass standard
          kubectl delete clusterrole local-path-provisioner-role
          kubectl delete clusterrolebinding local-path-provisioner-bind
          kubectl delete namespace local-path-storage --wait=false
          kubectl create namespace argocd
          helm template argocd argo-cd --repo https://argoproj.github.io/argo-helm \
              --version "$(yq '.argocdVersion' genesis-versions.yaml)" \
              --namespace argocd --include-crds -f ci/e2e/genesis-argocd.yaml \
            | kubectl apply --server-side -n argocd -f - >/dev/null
          kubectl -n argocd rollout status deployment,statefulset --timeout=5m

      - name: Point Argo CD at this commit
        run: |
          yq '(.spec.sources[].targetRevision) = strenv(REVISION)
            | (.spec.sources[0].helm.parameters[] | select(.name == "platformRevision") | .value) = strenv(REVISION)' \
            ci/clusters/kind.yaml | kubectl apply -f -

      - name: Wait for every Application and pod to be ready
        # Fails as soon as something is known to be broken; the timeout is
        # only the backstop for a hang.
        run: python ci/e2e/wait.py 600

      - name: Reach Argo CD through Traefik
        # Cilium's load balancer, Traefik serving the platform's wildcard
        # certificate (trusted here as its own CA, being self-signed), and
        # the platform's route to Argo CD.
        run: |
          kubectl -n traefik get secret wildcard-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > ca.crt
          ip=$(kubectl -n traefik get service traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -sSf --retry 5 --retry-all-errors --cacert ca.crt \
            --resolve "argocd.kind.test:443:$ip" https://argocd.kind.test/healthz

      - name: No Prometheus alerts pending or firing
        # What the platform's own monitoring says once it's up: a scrape
        # target that's down or a rule that's true from the start.
        run: python ci/e2e/alerts.py 180

      - name: Cluster state
        if: ${{ failure() }}
        run: |
          kubectl get applications -n argocd
          kubectl get pods -A -o wide | awk 'NR == 1 || $4 != "Completed" && split($3, r, "/") && r[1] != r[2]'
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp | tail -50
          ./kind export logs kind-logs >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: kind-logs
          path: kind-logs/
          if-no-files-found: ignore
