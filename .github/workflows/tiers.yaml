# Setup only. Every check lives in the Makefile; make test-commit fails this
# file if it ever runs one.
name: Test tiers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tiers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ghcr.io/bbaliyan/kube-devenv:0.13.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make test-commit BASE_REF=${{ github.event.pull_request.base.sha || github.event.before }}

  # Not a required check, and it runs beside commit, so a slow or failing diff
  # never blocks a merge and never delays the tiers.
  diff:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ghcr.io/bbaliyan/kube-devenv:0.13.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make diff-comment BASE_REF=${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rendered-manifests
          path: out/
          if-no-files-found: ignore

  comment:
    needs: diff
    # A fork's PR gets a read-only token, so it reads the diff in the diff
    # job's summary instead.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-manifests
          path: out/
      - run: ci/post-comment.sh ${{ github.event.pull_request.number }} out/comment.md
        env:
          GH_TOKEN: ${{ github.token }}

  integration:
    # Fork PRs get the commit tier only.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.1
      - run: pip install --quiet pyyaml
      - run: make test-integration GENESIS_REF=${{ github.event.pull_request.base.sha }} RUNTIME_IMAGES_OUT=out/runtime-images.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-images
          path: out/runtime-images.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: kind-logs
          path: kind-logs/
          if-no-files-found: ignore

  # Not a required check. It runs after integration and adds no time to it.
  # It builds the promotion record from the rendered clusters and the images
  # the kind run reported. See ci/README.md.
  record:
    needs: integration
    if: ${{ needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.1
      - run: pip install --quiet pyyaml jsonschema
      - run: make render
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-images
          path: out/
      - run: make promotion-record
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-record
          path: out/promotion-record.json

  # Not a required check. It scans the images of the promotion record with
  # Trivy from the pinned kube-devenv image, and it needs no cluster. It
  # compares nothing yet: the baseline is empty until a stable record exists, so
  # only a CISA KEV finding blocks. See "Security gate" in ci/README.md.
  # The Docker Hub token is read-only and only stops rate limits on shared
  # runner addresses. Without it the scans run anonymously.
  gate:
    needs: record
    if: ${{ github.event_name != 'pull_request' && needs.record.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/bbaliyan/kube-devenv:0.13.1
    env:
      DOCKER_CONFIG: /tmp/docker-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promotion-record
          path: out/
      - name: Docker Hub login for pulls
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_TOKEN" ] || exit 0
          mkdir -p "$DOCKER_CONFIG"
          auth="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 -w0)"
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$auth" > "$DOCKER_CONFIG/config.json"
      - run: make kev-catalog
      - run: make security-gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: promotion-record-scanned
          path: |
            out/promotion-record-scanned.json
            out/security-summary.md
            out/scan-results.json
          if-no-files-found: ignore
