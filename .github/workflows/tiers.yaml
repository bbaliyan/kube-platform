# Setup only. Every check lives in the Makefile; make test-commit fails this
# file if it ever runs one.
name: Test tiers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tiers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ghcr.io/bbaliyan/kube-devenv:0.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make test-commit BASE_REF=${{ github.event.pull_request.base.sha || github.event.before }}

  # Not a required check, and it runs beside commit, so a slow or failing diff
  # never blocks a merge and never delays the tiers.
  diff:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ghcr.io/bbaliyan/kube-devenv:0.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make diff-comment BASE_REF=${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rendered-manifests
          path: out/
          if-no-files-found: ignore

  comment:
    needs: diff
    # A fork's PR gets a read-only token, so it reads the diff in the diff
    # job's summary instead.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-manifests
          path: out/
      - run: ci/post-comment.sh ${{ github.event.pull_request.number }} out/comment.md
        env:
          GH_TOKEN: ${{ github.token }}

  integration:
    # Fork PRs get the commit tier only.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.1
      - run: pip install --quiet pyyaml
      - run: make test-integration GENESIS_REF=${{ github.event.pull_request.base.sha }} RUNTIME_IMAGES_OUT=out/runtime-images.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-images
          path: out/runtime-images.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: kind-logs
          path: kind-logs/
          if-no-files-found: ignore

  # Upgrade from the current stable, as Promote does. It runs beside
  # `integration`, so it adds no wall time. Add it to the ruleset to gate merges.
  integration-stable:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the stable commit
        id: stable
        run: |
          sha=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/stable | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::Cannot read the stable branch. The upgrade-from-stable case needs it."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.1
      - run: pip install --quiet pyyaml
      - run: make test-integration GENESIS_REF="$STABLE_SHA"
        env:
          STABLE_SHA: ${{ steps.stable.outputs.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: kind-logs-stable
          path: kind-logs/
          if-no-files-found: ignore

  # Not a required check. It runs after integration and adds no time to it.
  # It builds the promotion record from the rendered clusters and the images
  # the kind run reported. See ci/README.md.
  record:
    needs: integration
    if: ${{ needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.1
      - run: pip install --quiet pyyaml jsonschema
      - run: make render
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-images
          path: out/
      # Digests of immutable references only (see ci/promotion_record.py). Only
      # a pull request reads or writes this cache. Promote never does.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          path: .cache/digests.json
          key: digests-${{ github.run_id }}
          restore-keys: digests-
      - run: make promotion-record
        env:
          PROMOTION_RECORD_CACHE: ${{ github.event_name == 'pull_request' && '.cache/digests.json' || '' }}
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: ${{ always() && github.event_name == 'pull_request' }}
        with:
          path: .cache/digests.json
          key: digests-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-record
          path: out/promotion-record.json

  # Not a required check. It scans the images of the promotion record with
  # Trivy from the pinned kube-devenv image, and it needs no cluster. It
  # compares nothing yet: FIRST_PROMOTION=1 until a stable record exists, so
  # only a CISA KEV finding blocks. See "Security gate" in ci/README.md.
  # The Docker Hub token is read-only and only stops rate limits on shared
  # runner addresses. Without it the scans run anonymously.
  gate:
    needs: record
    if: ${{ github.event_name != 'pull_request' && needs.record.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/bbaliyan/kube-devenv:0.14.0
    env:
      DOCKER_CONFIG: /tmp/docker-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promotion-record
          path: out/
      - name: Docker Hub login for pulls
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_USERNAME$DOCKERHUB_TOKEN" ] || exit 0
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "set both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, or neither" >&2
            exit 1
          fi
          mkdir -p "$DOCKER_CONFIG"
          auth="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 -w0)"
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$auth" > "$DOCKER_CONFIG/config.json"
      - run: make kev-catalog
      - run: make security-gate FIRST_PROMOTION=1
      # Only a pass uploads the scanned record, so its name never hides a block.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() }}
        with:
          name: promotion-record-scanned
          path: out/promotion-record-scanned.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: security-gate-report
          path: |
            out/security-summary.md
            out/scan-results.json
            out/promotion-record-scanned.json
          if-no-files-found: ignore

  # Not a required check. The Stable watch workflow is scheduled, and GitHub
  # disables a schedule after 60 days without activity. This job runs on every
  # push to main, which a quiet repository cannot disable, and fails when the
  # newest Stable watch run is older than 2 days. It skips with a notice when
  # stable has no release yet. contents: read is for the checkout and the
  # release list; actions: read is for the run list.
  stable-watch-alive:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    container: ghcr.io/bbaliyan/kube-devenv:0.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make stable-watch-watchdog
        env:
          GH_TOKEN: ${{ github.token }}
