# Setup only. Every check lives in the Makefile; make test-commit fails this
# file if it ever runs one.
name: Test tiers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tiers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ghcr.io/bbaliyan/kube-devenv:0.12.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make test-commit BASE_REF=${{ github.event.pull_request.base.sha || github.event.before }}

  # Not a required check, and it runs beside commit, so a slow or failing diff
  # never blocks a merge and never delays the tiers.
  diff:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ghcr.io/bbaliyan/kube-devenv:0.12.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make diff-comment BASE_REF=${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rendered-manifests
          path: out/
          if-no-files-found: ignore

  comment:
    needs: diff
    # A fork's PR gets a read-only token, so it reads the diff in the diff
    # job's summary instead.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-manifests
          path: out/
      - run: ci/post-comment.sh ${{ github.event.pull_request.number }} out/comment.md
        env:
          GH_TOKEN: ${{ github.token }}

  integration:
    # Fork PRs get the commit tier only.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.1
      - run: pip install --quiet pyyaml
      - run: make test-integration GENESIS_REF=${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: kind-logs
          path: kind-logs/
          if-no-files-found: ignore
