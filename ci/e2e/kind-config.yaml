# One node, shaped like an RKE2 node as far as the platform can tell:
# no CNI or kube-proxy (Cilium replaces both, as on RKE2 here), and RKE2's
# default pod and service ranges.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
  podSubnet: 10.42.0.0/16
  serviceSubnet: 10.43.0.0/16
