# One node, shaped like an RKE2 node as far as the platform can tell:
# no CNI or kube-proxy (Cilium replaces both, as on this platform's RKE2
# nodes), and RKE2's default pod and service ranges.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
  podSubnet: 10.42.0.0/16
  serviceSubnet: 10.43.0.0/16
# The platform pulls about 2 GB of images at once; the kubelet otherwise
# pulls them one at a time.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    serializeImagePulls: false
    maxParallelImagePulls: 5
