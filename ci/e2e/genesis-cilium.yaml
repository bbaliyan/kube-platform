# What a node's genesis install of Cilium sets (kube-image's
# helm-values/cilium-values.yaml). Argo CD's cilium Application takes it
# over from there; without Hubble, adopting it restarts nothing.
kubeProxyReplacement: true
k8sServiceHost: "127.0.0.1"
k8sServicePort: 6443
rollOutCiliumPods: true
nodeIPAM:
  enabled: true
defaultLBServiceIPAM: nodeipam
resources:
  requests:
    cpu: 100m
    memory: 128Mi
envoy:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
operator:
  replicas: 1
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 512Mi
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
