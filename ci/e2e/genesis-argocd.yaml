# What a node's genesis install of Argo CD sets (kube-image's
# helm-values/argocd-values.yaml): a running Argo CD. No CPU limits, like
# the platform's own. The argocd
# Application takes it over from there with the platform's own values.
configs:
  cm:
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 10s
  params:
    server.insecure: "true"
repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
