# Proves RustFS serves the S3 API with the root keys that External Secrets
# made: create a bucket, put one object, get it back and compare. Applied by
# ci/e2e/run.sh once the platform is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-smoke
  namespace: rustfs
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: aws-cli
          image: docker.io/amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              aws configure set default.s3.addressing_style path
              aws s3 mb s3://e2e-smoke
              echo "hello rustfs" > /tmp/in
              aws s3 cp /tmp/in s3://e2e-smoke/hello
              aws s3 cp s3://e2e-smoke/hello /tmp/out
              cmp /tmp/in /tmp/out
          env:
            - name: AWS_ENDPOINT_URL
              value: http://rustfs.rustfs.svc:9000
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
