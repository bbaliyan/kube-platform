# A Proxmox cluster as kube-compute's proxmox-cluster module renders it
# (node-bootstrap's platform_app_yaml): repo credentials and a BYO CA from
# AWS SSM, local-path plus Longhorn storage,
# an extra Traefik entrypoint and Grafana plugins on a named storage class.
# It also has a workloads repo, so observability reads platform-values/observability.yaml
# from it; this repo stands in for that repo and has no such file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/bbaliyan/kube-platform.git
      targetRevision: stable
      path: bootstrap
      helm:
        valueFiles:
          - $values/platform/platform-versions/values.yaml
        parameters:
          - name: platformRepoURL
            value: "https://github.com/bbaliyan/kube-platform.git"
          - name: platformRevision
            value: "stable"
          - name: certMode
            value: "byo"
          - name: pkiIssuerName
            value: "org-ca-issuer"
          - name: ssmByoCaCertPath
            value: "/kube/cluster-1/ca-cert"
          - name: ssmByoCaChainPath
            value: "/kube/cluster-1/ca-chain"
          - name: ssmByoCaKeyPath
            value: "/kube/cluster-1/ca-key"
          - name: clusterName
            value: "cluster-1"
          - name: clusterFqdnSuffix
            value: "cluster-1.lan"
          - name: trustedCaPemB64
            value: ""
          - name: secretStoreType
            value: "aws-ssm"
          - name: awsRegion
            value: "eu-west-1"
          - name: ssmParameterPath
            value: "/kube/cluster-1/repo-cred"
          - name: repoCredsUrlPrefix
            value: "https://git.example.com/"
          - name: repoCredsUsername
            value: "deploy-token"
          - name: workloadsRepoURL
            value: "https://github.com/bbaliyan/kube-platform.git"
          - name: workloadsRevision
            value: "main"
          - name: workloadsPath
            value: "workloads"
        valuesObject:
          extraTags: {}
          argocdExtraConfigs:
            cm:
              url: https://argocd.example.com
              oidc.config: |
                name: SSO
                issuer: https://idp.example.com
                clientID: argocd
                clientSecret: $argocd-oidc:clientSecret
            rbac:
              scopes: "[email]"
              policy.csv: |
                g, admin@example.com, role:admin
          traefikExtraConfig:
            ports:
              postgres:
                port: 5432
                expose:
                  default: true
                exposedPort: 5432
                protocol: TCP
          observabilityExtraHelmValues:
            storageClassName: longhorn
            grafanaPlugins:
              - mssql
            grafanaIni:
              server:
                root_url: https://grafana.example.com/
              auth.generic_oauth:
                enabled: true
                client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
                client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
            grafanaEnvFromSecrets:
              - name: grafana-oauth
                optional: true
          storageProvisioners:
            - name: local-path
              type: local-path
            - name: longhorn
              type: longhorn
    - repoURL: https://github.com/bbaliyan/kube-platform.git
      targetRevision: stable
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
