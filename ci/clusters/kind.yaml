# The cluster the integration tier builds in kind and syncs for real (see
# ci/e2e/): a single node with self-signed certificates, Hubble and
# local-path storage, so everything it runs works without a cloud or a NAS.
# Like every example it follows `stable`. The integration tier does
# not apply this file as it is: ci/e2e/point-at-commit.py sets both sources
# and platformRevision to the commit under test.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/bbaliyan/kube-platform.git
      targetRevision: stable
      path: bootstrap
      helm:
        valueFiles:
          - $values/platform/platform-versions/values.yaml
        parameters:
          - name: platformRepoURL
            value: https://github.com/bbaliyan/kube-platform.git
          - name: platformRevision
            value: stable
          - name: certMode
            value: selfsigned
          - name: clusterName
            value: kind
          - name: clusterFqdnSuffix
            value: kind.test
          - name: trustedCaPemB64
            value: ""
        valuesObject:
          ciliumOperatorReplicas: 1
          hubbleEnabled: true
          observabilityExtraHelmValues:
            # The kind node image has no node_exporter.process SELinux module;
            # a type that is not loaded stops the pod from starting.
            nodeExporterSelinuxType: ""
          storageProvisioners:
            - name: local-path
              type: local-path
    - repoURL: https://github.com/bbaliyan/kube-platform.git
      targetRevision: stable
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
