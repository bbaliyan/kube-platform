prometheus:
  retention: 30d
  retentionSize: 34GB
  dropUnusedControlPlaneMetrics: true
  extraDropMetrics: ["etcd_request_duration_seconds_(sum|count)", "foo_.*"]
  storage: {size: 40Gi, storageClassName: fast}
alertmanager:
  storage: {size: 3Gi, storageClassName: cheap}
grafana:
  storage: {size: 6Gi, storageClassName: cheap}
loki:
  retention: 168h
  storage: {size: 20Gi, storageClassName: fast}
