apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: prometheus
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prometheus.{{ .Values.clusterFqdnSuffix }}`)
      kind: Rule
      services:
        # prometheus-app.yaml sets fullnameOverride: prometheus, so the
        # chart's generated Prometheus service is prometheus-prometheus, not
        # the chart's un-overridden default (<release>-kube-prometheus-
        # prometheus). Confirmed against a real cluster: traefik logged
        # "kubernetes service not found: prometheus/prometheus-kube-
        # prometheus-prometheus" continuously, and the real service was
        # named prometheus-prometheus.
        - name: prometheus-prometheus
          port: 9090
          namespace: prometheus
  tls: {}
