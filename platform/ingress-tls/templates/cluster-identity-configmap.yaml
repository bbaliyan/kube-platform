# A generic, cluster-wide primitive — not specific to anything ingress-tls
# itself does. Lives here anyway because this is already the earliest layer
# that receives both clusterName and clusterFqdnSuffix from Terraform
# (sync-wave 2), so no new Application/bootstrap plumbing is needed to
# stand it up. kube-public is the conventional "any workload can read this"
# namespace — same idea as Kubernetes' own built-in kube-public/cluster-info
# ConfigMap.
#
# Workload charts read this with Helm's `lookup` function instead of every
# per-cluster deployment repo having to retype the cluster's own name/domain
# suffix by hand — see kube-mssql-chart's ARCHITECTURE.md for the first real
# consumer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-identity
  namespace: kube-public
data:
  clusterName: {{ .Values.clusterName | quote }}
  clusterFqdnSuffix: {{ .Values.clusterFqdnSuffix | quote }}
