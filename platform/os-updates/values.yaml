image:
  repository: busybox
  # renovate: datasource=docker depName=busybox
  tag: "1.38.0"

intervalSeconds: 3600

# Must match node-exporter's --collector.textfile.directory (relative to the host root).
# On an SELinux host the collector also labels this directory container_ro_file_t,
# because node-exporter runs confined and cannot read the default label.
textfileDirectory: /var/lib/node_exporter/textfile_collector

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 512Mi
