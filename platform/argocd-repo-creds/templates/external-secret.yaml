{{- /*
Auth mode follows the repoCredsUrlPrefix scheme:
  https:// prefix — the secret store holds a token (e.g. GitLab deploy token);
    rendered as username/password. repoCredsUsername is required.
  SSH prefix (git@... or ssh://...) — the secret store holds a private key;
    rendered as sshPrivateKey.
*/}}
{{- $https := hasPrefix "https://" .Values.repoCredsUrlPrefix }}
{{- $credKey := ternary "password" "sshPrivateKey" $https }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-repo-store
    kind: ClusterSecretStore
  target:
    name: argocd-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: {{ .Values.repoCredsUrlPrefix | quote }}
        {{- if $https }}
        username: {{ required "repoCredsUsername is required when repoCredsUrlPrefix is https" .Values.repoCredsUsername | quote }}
        password: "{{ `{{ .password }}` }}"
        {{- else }}
        sshPrivateKey: "{{ `{{ .sshPrivateKey }}` }}"
        {{- end }}
  data:
    - secretKey: {{ $credKey }}
      remoteRef:
        {{- if eq .Values.secretStoreType "vault" }}
        key: {{ trimPrefix "secret/data/" .Values.vaultSecretPath | quote }}
        property: {{ $credKey }}
        {{- else if eq .Values.secretStoreType "aws-ssm" }}
        key: {{ .Values.ssmParameterPath | quote }}
        {{- else if eq .Values.secretStoreType "azure-keyvault" }}
        key: {{ .Values.azureSecretName | quote }}
        {{- end }}
