# Single source of truth for platform component versions, shared across every
# cluster tracking this repo's protected branch. Cluster-agnostic by design —
# no consumer/cluster-specific values belong here.
#
# Two consumers read this file:
#   - Argo CD / Helm: charts that need a version — the system-upgrade-controller
#     Plan's k8s_version, and (via the bootstrap chart's own multi-source
#     Application, see kube-compute's node-bootstrap platform_app_yaml)
#     cilium-app.yaml's/argocd-app.yaml's own targetRevision — template it
#     from these values.
#   - Node image builds: kube-image's packer/aws/build.sh fetches this file and bakes
#     k8sVersion, ciliumVersion and argocdVersion into the image. A new node boots
#     the versions of the image it was built from, so a bump reaches new nodes only
#     with the next image build; until then the upgrade Plan brings them forward.
#
# Bumping a version here is the entire operator action for a routine RKE2/platform
# component upgrade — no terragrunt apply required for the upgrade itself. The RKE2
# Plan is synced by hand, one cluster at a time.

# renovate: datasource=github-releases depName=rancher/rke2
k8sVersion: v1.37.1+rke2r1

# renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
argocdVersion: 10.10.1

# renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io/
ciliumVersion: 1.20.2

# renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
capiCoreVersion: "v1.14.2"

# renovate: datasource=github-releases depName=ionos-cloud/cluster-api-provider-proxmox
capmoxVersion: "v0.9.1"

# renovate: datasource=helm depName=cluster-autoscaler registryUrl=https://kubernetes.github.io/autoscaler
clusterAutoscalerVersion: "9.59.0"

# renovate: datasource=helm depName=aws-cloud-controller-manager registryUrl=https://kubernetes.github.io/cloud-provider-aws
awsCloudControllerManagerVersion: "0.0.12"

# renovate: datasource=docker depName=registry.k8s.io/provider-aws/cloud-controller-manager
awsCloudControllerManagerImageTag: "v1.37.0"

# renovate: datasource=helm depName=gpu-operator registryUrl=https://helm.ngc.nvidia.com/nvidia
gpuOperatorVersion: "v26.7.1"

# renovate: datasource=helm depName=nvidia-gpu-exporter registryUrl=https://utkuozdemir.github.io/nvidia_gpu_exporter
nvidiaGpuExporterVersion: "2.15.1"
