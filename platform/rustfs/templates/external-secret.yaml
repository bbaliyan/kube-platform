apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ required "secretStore.name is required" .Values.secretStore.name | quote }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: rustfs-credentials
    creationPolicy: Owner
  data:
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: {{ required "credentials.remoteKey is required" .Values.credentials.remoteKey | quote }}
        property: {{ .Values.credentials.accessKeyProperty | quote }}
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: {{ .Values.credentials.remoteKey | quote }}
        property: {{ .Values.credentials.secretKeyProperty | quote }}
