{{- if .Values.hubbleEnabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hubble.{{ .Values.clusterFqdnSuffix }}`)
      kind: Rule
      services:
        - name: hubble-ui
          port: 80
          namespace: kube-system
  tls: {}
{{- end }}
