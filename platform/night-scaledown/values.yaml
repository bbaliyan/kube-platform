# Must run before whatever stops the control plane. Once the API server is gone
# nothing can scale anything, and the workers would bill until morning.
schedule: "55 19 * * *"
timeZone: "Australia/Sydney"
resumeSchedule: "30 20 * * *"

# How stale a missed schedule may be and still run. Short on purpose: the point is
# that a schedule missed while the cluster was off never fires on startup.
startingDeadlineSeconds: 300

# Nothing scales the groups back up on a schedule. The resume Deployment hands
# them back to cluster-autoscaler when the nodes next boot, and it creates workers
# for whatever is Pending.
kubectlImage: registry.k8s.io/kubectl:v1.37.0
pauseImage: registry.k8s.io/pause:3.10.2

platformNodeSelector: {}
