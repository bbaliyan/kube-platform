  name: grafana-dashboard-nvidia-gpu-video
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  nvidia-gpu-video.json: |
{{ .Files.Get "dashboards/nvidia-gpu-video.json" | indent 4 }}
{{- end }}
