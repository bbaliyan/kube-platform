apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # ServerSideApply (below) makes Argo CD compute the diff with its built-in
    # gitops-engine schema, which lags the real CRDs and doesn't know newer
    # prometheus-operator fields (e.g. .spec.hostNetwork) — the sync then fails
    # with "field not declared in schema". ServerSideDiff runs the diff as a
    # server-side dry-run apply against the live CRD schema, which does know the
    # field. See argoproj/argo-cd#20458.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
    targetRevision: "90.2.0"
    helm:
      values: |
        fullnameOverride: prometheus

        grafana:
{{- if .Values.grafanaPlugins }}
          plugins:
{{- range .Values.grafanaPlugins }}
            - {{ . | quote }}
{{- end }}
          # Mandatory alongside plugins on Grafana 13. See values.yaml.
          shadowBundledPlugins: true
{{- end }}
          persistence:
            enabled: true
            size: 5Gi
{{- if .Values.storageClassName }}
            storageClassName: {{ .Values.storageClassName | quote }}
{{- end }}
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          grafana.ini:
            server:
              root_url: "%(protocol)s://%(domain)s/"
              serve_from_sub_path: false
          sidecar:
            datasources:
              enabled: true
              # Lets any namespace self-register a Grafana datasource via a
              # Secret labeled grafana_datasource: "1" -- the same pattern
              # dashboards already use (sidecar.dashboards, this chart's own
              # default, searchNamespace: ALL). Adds no new RBAC: the
              # dashboards sidecar's existing searchNamespace: ALL already
              # makes this chart create a ClusterRole granting Grafana's
              # ServiceAccount cluster-wide get/watch/list on Secrets too
              # (grafana subchart's clusterrole.yaml grants configmaps AND
              # secrets together, gated on either sidecar needing ALL) --
              # confirmed via `helm template` against this exact chart
              # version before enabling. This setting only makes Grafana
              # use a permission it already silently holds.
              searchNamespace: ALL
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.loki.svc.cluster.local:3100
              access: proxy
              isDefault: false
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  orgId: 1
                  folder: ""
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              # Official Argo CD dashboard (grafana.com/dashboards/14584),
              # fetched at pod start. Pairs with the argocd PodMonitor below.
              argocd:
                gnetId: 14584
                revision: 1
                datasource: Prometheus
              # Community CronJob/Job dashboard (grafana.com/dashboards/14279),
              # kube-state-metrics based — no extra scrape config needed, this
              # chart already deploys kube-state-metrics. Single revision
              # since 2021 (unmaintained but still functional: the
              # kube_job_status_*/kube_cronjob_* metric names it queries
              # haven't changed).
              cronjobs:
                gnetId: 14279
                revision: 1
                datasource: Prometheus
{{- if .Values.hubbleEnabled }}
              # Upstream Cilium project's own dashboards (not published under
              # a grafana.com gnetId), fetched by URL at pod start — same
              # sidecar mechanism as the gnetId dashboards above. Only useful
              # once cilium-app.yaml's hubbleEnabled branch has actually
              # deployed hubble-relay/hubble-ui and the metrics
              # ServiceMonitor; kept in lockstep via the same Values key.
              #
              # NOTE: examples/kubernetes/addons/prometheus/files/grafana-dashboards/*
              # are git symlinks in the cilium repo, not real files --
              # raw.githubusercontent.com serves symlinks as the literal link-target
              # string, not the JSON they point to (confirmed live: Grafana wrote
              # a ~90-byte file containing the relative path text, not a dashboard).
              # Use the real files the symlinks point at instead.
              cilium:
                url: https://raw.githubusercontent.com/cilium/cilium/main/install/kubernetes/cilium/files/cilium-agent/dashboards/cilium-dashboard.json
                datasource: Prometheus
              hubble:
                url: https://raw.githubusercontent.com/cilium/cilium/main/install/kubernetes/cilium/files/hubble/dashboards/hubble-dashboard.json
                datasource: Prometheus
{{- end }}

        prometheusOperator:
          # Route the admission-webhook TLS cert through cert-manager instead
          # of the chart's default self-signed create/patch Jobs. Those Jobs
          # set ttlSecondsAfterFinished and self-delete right after running —
          # Kubernetes' TTL controller does this outside Argo CD's control,
          # and Argo CD's Helm-hook tracking then finds the Job "missing" on
          # every following sync and fails permanently (observed on
          # cluster-media: SyncError, "Resource batch/Job/prometheus-admission-create
          # is missing"). certManager.enabled removes the Jobs entirely —
          # confirmed via `helm template` with this flag set that no Job
          # manifests are rendered, only a cert-manager Certificate.
          admissionWebhooks:
            certManager:
              enabled: true
              issuerRef:
                name: {{ .Values.issuerName | quote }}
                kind: ClusterIssuer

        prometheus:
          # The bootstrap Argo CD install does not create metrics Services, but
          # every component pod exposes a container port named "metrics"
          # (controller 8082, repo-server 8084, server 8083, applicationset 8080).
          # A PodMonitor scrapes those directly, and creating it through this
          # chart gives it the release label Prometheus's selector requires.
          additionalPodMonitors:
            - name: argocd
              namespaceSelector:
                matchNames:
                  - argocd
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - argocd-application-controller
                      - argocd-repo-server
                      - argocd-server
                      - argocd-applicationset-controller
              podMetricsEndpoints:
                - port: metrics
          prometheusSpec:
            retention: 7d
            storageSpec:
              volumeClaimTemplate:
                spec:
{{- if .Values.storageClassName }}
                  storageClassName: {{ .Values.storageClassName | quote }}
{{- end }}
                  resources:
                    requests:
                      storage: 20Gi
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi

        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
{{- if .Values.storageClassName }}
                  storageClassName: {{ .Values.storageClassName | quote }}
{{- end }}
                  resources:
                    requests:
                      storage: 2Gi
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

        kubeStateMetrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi

        # NOTE: kube-prometheus-stack's own top-level `nodeExporter:` key only
        # has enabled/operatingSystems/forceDeployDashboards -- resources and
        # tolerations both live under the prometheus-node-exporter subchart's
        # own namespace instead. A prior `nodeExporter: resources:` here was
        # a silent no-op (confirmed live: the DaemonSet rendered
        # resources: {}) -- fixed here alongside adding tolerations, which
        # would have no-op'd the same way under the wrong key.
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          tolerations:
{{ .Values.nodeExporterTolerations | toYaml | indent 12 }}

        # RKE2 does not expose etcd's Prometheus metrics on its client port
        # (2379, mTLS-protected) — it needs etcd-expose-metrics: true set on
        # the server (kube-compute's node-bootstrap sets this), which then
        # listens on a separate, dedicated metrics port, 2381. This chart's
        # own kubeEtcd.service.targetPort default (2379) never matches that,
        # so the etcd dashboard shows no data regardless of ServiceMonitor
        # config. RKE2's listen-metrics-urls for this port is plain http://
        # (confirmed via rancher/rke2 maintainer examples), matching this
        # chart's own kubeEtcd.serviceMonitor.scheme: http default — no
        # TLS/client-cert config added here. Not verified against a live
        # cluster; confirm the scrape actually succeeds before assuming this
        # is complete.
        kubeEtcd:
          service:
            port: 2381
            targetPort: 2381
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  # Grafana's chart keeps its random admin password stable via Helm lookup(),
  # which returns empty under Argo CD (`helm template`, no cluster access) — so
  # each sync would regenerate it and drift from the DB-initialized value. Pin
  # the first-generated password by ignoring the field on sync.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: prometheus-grafana
      namespace: prometheus
      jsonPointers:
        - /data/admin-password
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
