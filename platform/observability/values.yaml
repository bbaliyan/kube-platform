# Storage class for Loki, Prometheus, Grafana, and Alertmanager PVCs.
# Empty string = use the cluster's default storage class (recommended — the
# storage-provisioner wave sets the appropriate default before this deploys).
storageClassName: ""

# When set, Traefik IngressRoutes are created for Grafana and Prometheus.
# Must match the clusterFqdnSuffix used in kube-platform bootstrap.
clusterFqdnSuffix: ""

# Source repo for the observability-ingress-routes sub-chart.
# Set by the parent bootstrap Application so all sub-apps come from the same repo.
platformRepoURL: ""
platformRevision: main

# Adds the Cilium/Hubble Grafana dashboards. Set by the parent bootstrap
# Application from its own hubbleEnabled — keep in sync with whether
# cilium-app.yaml actually deployed hubble-relay/hubble-ui, or the dashboards
# show no data.
hubbleEnabled: false

# ClusterIssuer used to mint the prometheus-operator admission-webhook TLS
# cert via cert-manager (see prometheus-app.yaml) instead of the chart's
# default self-signed create/patch Jobs — those Jobs self-delete via
# ttlSecondsAfterFinished, which Argo CD's Helm-hook tracking then sees as
# "resource missing" on every subsequent sync and fails permanently. Set by
# the parent bootstrap Application from its own pkiIssuerName.
issuerName: platform-issuer

# Grafana plugins installed at startup, as plugin ids optionally followed by
# a version ("mssql" for the latest, "mssql 13.0.4" to pin). This is the
# chart's own plugins value, which is the mechanism Grafana documents for
# Kubernetes; nothing here hand-rolls an installer.
#
# Grafana 13.2 moved several datasources out of core into standalone plugins,
# Microsoft SQL Server among them. A cluster whose workloads self-register an
# mssql datasource (kube-databases does) lists it here.
#
# A non-empty list also turns on shadowBundledPlugins (see prometheus-app.yaml),
# and the two are inseparable on Grafana 13. The chart wires plugins to
# GF_PLUGINS_PREINSTALL_SYNC; Grafana finds the plugin already present in the
# image's bundled directory, tries to replace it with the newer release, and
# cannot, because that path is inside the read-only image:
#
#   failed to install plugin mssql@: unlinkat
#   /usr/share/grafana/data/plugins-bundled/mssql: read-only file system
#
# Preinstall is synchronous, so that failure takes the whole pod down rather
# than degrading. shadowBundledPlugins mounts an emptyDir over that directory,
# so the install lands in /var/lib/grafana/plugins on this chart's PVC instead.
#
# The chart warns that shadowing hides bundled plugins not listed here. Measured
# against grafana 13.2.1-distroless, that is narrower than it sounds: the 13
# bundled entries (prometheus, loki, elasticsearch, postgres, mysql, tempo and
# so on) all still register, because the image carries them outside that
# directory too. Plugins loaded drops from 51 to 38 as the duplicates stop
# being counted, and the same 18 backends come up either way. Re-measure this
# on a major Grafana bump before assuming it still holds.
#
# Opt-in per cluster rather than a platform-wide default: preinstall blocks
# startup until each plugin is fetched from grafana.com, so on a cluster with
# no egress there a non-empty list stops Grafana coming up at all.
#
# Idempotent. Grafana skips a plugin already present under
# /var/lib/grafana/plugins, so restarts and re-syncs re-download nothing.
grafanaPlugins: []

# Extra tolerations for the node-exporter DaemonSet, so it still runs on a
# node carrying a custom taint (e.g. a dedicated-workload taint) instead of
# going dark in monitoring for exactly the node most worth watching. Empty
# by default -- most clusters have no tainted nodes.
nodeExporterTolerations: []
