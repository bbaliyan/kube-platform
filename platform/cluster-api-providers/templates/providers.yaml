apiVersion: v1
kind: Namespace
metadata:
  name: capa-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# The AWS provider's manifest requires AWS_B64ENCODED_CREDENTIALS. Empty leaves the
# controller's credentials file empty, so the AWS SDK falls back to the instance
# profile of the node it runs on.
apiVersion: v1
kind: Secret
metadata:
  name: aws-provider-variables
  namespace: capa-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
stringData:
  AWS_B64ENCODED_CREDENTIALS: ""
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
spec:
  version: {{ required "capiCoreVersion must be set" .Values.capiCoreVersion | quote }}
  {{- with .Values.platformNodeSelector }}
  deployment:
    nodeSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: aws
  namespace: capa-system
spec:
  version: {{ required "capaVersion must be set" .Values.capaVersion | quote }}
  configSecret:
    name: aws-provider-variables
    namespace: capa-system
  {{- if or .Values.awsRegion .Values.platformNodeSelector }}
  deployment:
    {{- with .Values.platformNodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.awsRegion }}
    containers:
      - name: manager
        env:
          - name: AWS_REGION
            value: {{ . | quote }}
    {{- end }}
  {{- end }}
