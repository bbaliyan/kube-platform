{{/*
No configSecret on the AWS provider: the controller authenticates through the
instance profile of the node it runs on, via the AWS SDK credential chain. There
is nowhere for a static key pair to come from that would not be a credential in
git or in an image, and the node already has an IAM role this project's consumer
repo attaches policies to.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: capa-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
spec:
  version: {{ required "capiCoreVersion must be set" .Values.capiCoreVersion | quote }}
  {{- with .Values.platformNodeSelector }}
  deployment:
    nodeSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: aws
  namespace: capa-system
spec:
  version: {{ required "capaVersion must be set" .Values.capaVersion | quote }}
  {{- if .Values.awsRegion }}
  manager:
    additionalEnv:
      - name: AWS_REGION
        value: {{ .Values.awsRegion | quote }}
  {{- end }}
  {{- with .Values.platformNodeSelector }}
  deployment:
    nodeSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
