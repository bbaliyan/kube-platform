{{/*
No configSecret on the AWS provider: the controller runs on the control-plane
node and authenticates through that node's own instance profile via the AWS SDK
credential chain. There is nowhere for a static key pair to come from that would
not be a credential in git or in an image, and the node already has an IAM role
this project's consumer repo attaches policies to.
*/}}
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
spec:
  version: {{ required "capiCoreVersion must be set" .Values.capiCoreVersion | quote }}
  deployment:
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/etcd
        operator: Exists
        effect: NoExecute
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: aws
  namespace: capa-system
spec:
  version: {{ required "capaVersion must be set" .Values.capaVersion | quote }}
  {{- if .Values.awsRegion }}
  manager:
    additionalEnv:
      - name: AWS_REGION
        value: {{ .Values.awsRegion | quote }}
  {{- end }}
  deployment:
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/etcd
        operator: Exists
        effect: NoExecute
