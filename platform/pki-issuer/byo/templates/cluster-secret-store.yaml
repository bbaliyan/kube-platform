# Self-contained secret store for the BYO CA — not shared with argocd-repo-creds
# (a different, unrelated concern). Keeps pki-issuer deployable independently of
# whether Argo CD repo credentials have been set up.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: byo-ca-store
spec:
  provider:
    {{- if eq .Values.secretStoreType "aws-ssm" }}
    aws:
      service: ParameterStore
      region: {{ .Values.awsRegion | quote }}
      # Without awsPodIdentity there is no auth block: the AWS SDK default credential
      # chain uses the EC2 instance profile.
      {{- if .Values.awsPodIdentity }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
      {{- end }}
    {{- else if eq .Values.secretStoreType "azure-keyvault" }}
    azurekv:
      tenantId: {{ .Values.azureTenantId | quote }}
      vaultUrl: {{ .Values.azureKeyVaultUrl | quote }}
      authType: WorkloadIdentity
    {{- else }}
    {{- fail (printf "unknown secretStoreType %q: vault, aws-ssm or azure-keyvault" .Values.secretStoreType) }}
    {{- end }}
