apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuerName }}
spec:
  acme:
    email: {{ required "acmeEmail is required when certMode is acme" .Values.email | quote }}
    server: {{ .Values.server | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuerName }}-acme-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
