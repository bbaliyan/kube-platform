apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: rke2-server
  namespace: system-upgrade
spec:
  # Etcd quorum tolerates losing at most one control-plane node at a time —
  # this must never be raised, regardless of cluster size.
  concurrency: 1
  version: {{ .Values.k8sVersion | quote }}
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  serviceAccountName: system-upgrade
  # Control-plane nodes provisioned with dedicated_control_plane/control_plane_taint
  # (kube-compute) carry CriticalAddonsOnly=true:NoExecute to keep user workloads
  # off them. The upgrade job must still land there to upgrade the node — same
  # fix already applied to cilium-operator for the same taint.
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoExecute
  {{- if .Values.singleNodeCluster }}
  # Single-node cluster: no other node exists to receive a cordoned node's
  # workloads, so cordon/drain is a no-op at best, actively harmful at worst
  # (rancher/rancher#48752 — the upgrade gets stuck waiting on an uncordon
  # that can never happen). Explicitly disabled rather than left to default.
  cordon: false
  {{- else }}
  cordon: true
  {{- end }}
  upgrade:
    image: rancher/rke2-upgrade
