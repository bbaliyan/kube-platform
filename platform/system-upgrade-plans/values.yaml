# Defaults here are only used when rendering locally (e.g. helm template for
# validation) — k8sVersion comes from the multi-source values reference to
# platform/platform-versions/values.yaml.

# How many worker nodes system-upgrade-controller upgrades concurrently.
# Workers hold no etcd/quorum state, so this can safely exceed 1 — unlike the
# server Plan, which is always concurrency: 1 (etcd quorum tolerates losing
# at most one control-plane node at a time; see #16's resolution).
agentConcurrency: 2

# RKE2 version target — left empty here; supplied via the multi-source values
# reference to platform/platform-versions/values.yaml's k8sVersion at deploy
# time. Only meaningful as a placeholder for standalone `helm template` runs.
k8sVersion: ""
