# Ensure the ebs-gp3 class is explicitly marked as the cluster default.
# This resource is declarative and idempotent; the dependency chart may also
# create it — ServerSideApply in the Argo CD sync options handles the merge.
#
# No sibling job demotes local-path's default-class annotation here: RKE2
# doesn't bundle local-path-provisioner (that's a k3s default, not RKE2's —
# this platform installs it itself, only under platform/storage-provisioner/
# local-path/, and only when a consumer explicitly selects it via
# storageProvisionerType/-Secondary). No consumer in this repo currently
# pairs "local-path" with "aws-ebs" on the same cluster, so there is no
# competing default to demote. If that combination is ever needed, the
# arbitration belongs at the bootstrap/app-of-apps level (symmetric across
# all backend pairs), not as one backend's chart reaching into another's
# StorageClass by hardcoded name.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
