# Values passed to the aws-ebs-csi-driver dependency chart.
# See https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/master/charts/aws-ebs-csi-driver/values.yaml
aws-ebs-csi-driver:
  controller:
    replicaCount: 1
    # Off by default upstream — without it, the chart never adds the
    # "volumemodifier" sidecar container to the controller pod at all, so
    # nothing ever watches PVCs for a VolumeAttributesClass change or calls
    # AWS's ModifyVolume API. Needed for any workload chart that changes
    # storage.data.iops/throughputMBps live (e.g. kube-databases' chart-mssql).
    volumeModificationFeature:
      enabled: true
  storageClasses:
    - name: ebs-gp3
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      volumeBindingMode: WaitForFirstConsumer
      reclaimPolicy: Delete
      parameters:
        type: gp3
        encrypted: "true"
