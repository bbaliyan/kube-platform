# Values passed to the aws-ebs-csi-driver dependency chart.
# See https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/master/charts/aws-ebs-csi-driver/values.yaml
aws-ebs-csi-driver:
  controller:
    replicaCount: 1
    # OFF, deliberately. This adds the "volumemodifier" sidecar
    # (volume-modifier-for-k8s) — an older, annotation-driven mechanism
    # for changing IOPS/throughput that AWS has since deprecated
    # (kubernetes-sigs/aws-ebs-csi-driver#2435), superseded by native
    # VolumeAttributesClass support built into the driver itself from
    # v1.35.0 on (we run v1.63.1) and handled by the resizer sidecar
    # directly (external-resizer added ControllerModifyVolume-via-VAC
    # support in v2.2.0; we run v2.2.1) — no extra sidecar needed for the
    # VolumeAttributesClass-based flow chart-mssql actually uses.
    #
    # We turned this on earlier because nothing was calling AWS's
    # ModifyVolume at the time, without conclusively ruling out resizer
    # on its own first. volume-modifier-for-k8s turned out to have two
    # real bugs of its own once live: a leader-election lease collision
    # with resizer (kubernetes-sigs/aws-ebs-csi-driver#1759), and — even
    # after fixing that — it would reconcile a PVC once on its own
    # startup scan and then silently never reprocess it after a later
    # spec change, needing a manual pod restart to notice again. Given
    # it's also the deprecated path, fixing forward means not using it
    # at all rather than continuing to patch around it.
    volumeModificationFeature:
      enabled: false
  storageClasses:
    - name: ebs-gp3
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      volumeBindingMode: WaitForFirstConsumer
      reclaimPolicy: Delete
      parameters:
        type: gp3
        encrypted: "true"
