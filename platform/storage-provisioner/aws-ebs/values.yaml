# Values passed to the aws-ebs-csi-driver dependency chart.
# See https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/master/charts/aws-ebs-csi-driver/values.yaml
aws-ebs-csi-driver:
  controller:
    replicaCount: 1
    # Left off (the upstream default). This adds the "volumemodifier"
    # sidecar, which drives volume changes from *annotations* on a PVC
    # (ebs.csi.aws.com/iops and friends) — an older, now-deprecated
    # mechanism (kubernetes-sigs/aws-ebs-csi-driver#2435). We drive changes
    # from VolumeAttributesClass instead, which is handled by the resizer
    # and provisioner sidecars below, so this one has nothing to do here.
    # See the driver's docs/modify-volume.md for the split.
    volumeModificationFeature:
      enabled: false

  sidecars:
    # VolumeAttributesClass is how kube-databases changes a volume's
    # IOPS/throughput after creation, so both sidecars that implement it get
    # the feature gate pinned on.
    #
    # This is precautionary rather than a fix for anything seen here — the
    # gate is GA and on by default. But the chart decides it at render time
    # from `.Capabilities.APIVersions.Has "…/VolumeAttributesClass"` and
    # emits `--feature-gates=VolumeAttributesClass=false` when it comes up
    # empty. Under Argo CD those capabilities come from a cached API list
    # rather than live discovery, and if that ever misses, volume
    # modification stops working with nothing logged to say why. A pinned
    # flag is worth the noise against a silent failure like that.
    #
    # ON UPGRADE: the sidecars log "setting GA feature gate. It will be
    # removed in a future release" at startup. Once it is removed, passing
    # the flag will fail to parse — drop these two lines then.
    #
    # (When the chart emits its own value the flag appears twice. Both
    # sidecars parse with Go's stdlib flag package, so the last wins.)
    provisioner:
      additionalArgs:
        - --feature-gates=VolumeAttributesClass=true
    resizer:
      additionalArgs:
        - --feature-gates=VolumeAttributesClass=true
        # With replicaCount 1 there is only ever one pod, so leader election
        # costs a lease to acquire and buys nothing. Set here rather than via
        # sidecars.resizer.leaderElection.enabled, which looks like the right
        # knob but is a no-op: the chart renders it as `.enabled | default
        # true`, and Helm's `default` treats false as unset.
        - --leader-election=false
  storageClasses:
    - name: ebs-gp3
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      volumeBindingMode: WaitForFirstConsumer
      reclaimPolicy: Delete
      parameters:
        type: gp3
        encrypted: "true"
