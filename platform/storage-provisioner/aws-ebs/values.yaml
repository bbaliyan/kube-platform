# Values passed to the aws-ebs-csi-driver dependency chart.
# See https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/master/charts/aws-ebs-csi-driver/values.yaml
aws-ebs-csi-driver:
  controller:
    replicaCount: 1
    # Left off (the upstream default). This adds the "volumemodifier"
    # sidecar, which drives volume changes from *annotations* on a PVC
    # (ebs.csi.aws.com/iops and friends) — an older, now-deprecated
    # mechanism (kubernetes-sigs/aws-ebs-csi-driver#2435). We drive changes
    # from VolumeAttributesClass instead, which is handled by the resizer
    # and provisioner sidecars below, so this one has nothing to do here.
    # See the driver's docs/modify-volume.md for the split.
    volumeModificationFeature:
      enabled: false

  sidecars:
    # VolumeAttributesClass is the whole mechanism kube-databases uses to
    # change a volume's IOPS/throughput after creation, so pin its feature
    # gate on explicitly in both sidecars that implement it.
    #
    # The chart otherwise decides this at render time from
    # `.Capabilities.APIVersions.Has "…/VolumeAttributesClass"` and renders
    # `--feature-gates=VolumeAttributesClass=false` when it doesn't find it.
    # Under Argo CD those capabilities come from its cluster cache rather
    # than a live discovery call, so a stale or incomplete cache turns the
    # feature off silently — the PVC then just sits at modifyVolumeStatus
    # "Pending" forever with nothing logged anywhere. The flag is repeated
    # rather than replaced when the chart also emits it; both sidecars parse
    # args with Go's stdlib flag package, where the last occurrence wins.
    provisioner:
      additionalArgs:
        - --feature-gates=VolumeAttributesClass=true
    resizer:
      # Set via additionalArgs, not leaderElection.enabled below: the chart
      # renders that as `.enabled | default true`, and Helm's `default`
      # treats false as unset, so setting it there alone is a no-op. Same
      # last-occurrence-wins trick as the feature gate above.
      #
      # Worth turning off because the resizer and volumemodifier share one
      # lease name despite being separate containers
      # (kubernetes-sigs/aws-ebs-csi-driver#1759). volumemodifier is gone as
      # of the setting above, but with replicaCount 1 there is only ever one
      # pod, so leader election buys nothing either way.
      additionalArgs:
        - --feature-gates=VolumeAttributesClass=true
        - --leader-election=false
      leaderElection:
        enabled: false
  storageClasses:
    - name: ebs-gp3
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      volumeBindingMode: WaitForFirstConsumer
      reclaimPolicy: Delete
      parameters:
        type: gp3
        encrypted: "true"
