# Values passed to the aws-ebs-csi-driver dependency chart.
# See https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/master/charts/aws-ebs-csi-driver/values.yaml
aws-ebs-csi-driver:
  controller:
    replicaCount: 1
    # Adds the "volumemodifier" sidecar, which is what actually calls AWS's
    # ModifyVolume when a PVC's volumeAttributesClassName changes. Off by
    # default upstream; without it, IOPS/throughput changes silently never
    # reach AWS at all.
    #
    # Note this sidecar (volume-modifier-for-k8s) is formally deprecated
    # (kubernetes-sigs/aws-ebs-csi-driver#2435) in favour of native
    # VolumeAttributesClass handling in the resizer sidecar. We tried
    # turning it off to use that path and modifications stopped happening
    # — a valid change sat at modifyVolumeStatus "Pending" indefinitely
    # with nothing logging anything — so it's back on until the native
    # path is verified working here. Revisit on a driver upgrade, but
    # verify against a real IOPS change before switching, not on the
    # deprecation notice alone.
    volumeModificationFeature:
      enabled: true
  # volumemodifier and resizer default to contending for the same
  # leader-election lease even though they're separate containers
  # (kubernetes-sigs/aws-ebs-csi-driver#1759) — observed live as
  # volumemodifier silently going deaf until a pod restart. With
  # replicaCount 1 there's only ever one pod, so leader election buys us
  # nothing and costs us that collision.
  #
  # Only volumemodifier's setting takes effect: the chart renders resizer's
  # as `.enabled | default true`, and Helm's `default` treats false as
  # unset. Set on both anyway to record intent, and because disabling
  # volumemodifier's side alone is enough — resizer is then the lease's
  # only participant.
  sidecars:
    resizer:
      leaderElection:
        enabled: false
    volumemodifier:
      leaderElection:
        enabled: false
  storageClasses:
    - name: ebs-gp3
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      volumeBindingMode: WaitForFirstConsumer
      reclaimPolicy: Delete
      parameters:
        type: gp3
        encrypted: "true"
