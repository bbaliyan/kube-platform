# Generic democratic-csi scaffold — no backend (TrueNAS or otherwise) is
# specific to this chart. Everything below is genuinely consumer-specific
# (which NAS/SAN, its connection details, dataset layout) and MUST be
# supplied per-cluster via platform_extra_helm_parameters /
# platform_helm_values_object in the consumer repo — never filled in here.
#
# Nested under "democratic-csi" because that's the Helm dependency's release
# name (values for a subchart must be namespaced under it, not top-level —
# same pattern as aws-ebs's values being nested under aws-ebs-csi-driver).
#
# democratic-csi.driver.config holds the full backend driver config (see
# https://github.com/democratic-csi/democratic-csi/tree/master/examples for
# the shape per backend, e.g. freenas-api-iscsi for TrueNAS over iSCSI).
# Secrets (API keys/passwords) inside it must never be set directly in
# git-tracked values — use driver.existingConfigSecret to point at a secret
# created out-of-band instead, and leave driver.config.driver as the only
# key set here (the chart needs it even when existingConfigSecret is used).
democratic-csi:
  driver:
    existingConfigSecret: ""
    config:
      driver: ""

  csiDriver:
    name: ""

  storageClasses: []

  # Every image is pinned here, at the chart's own defaults except the
  # driver, which the chart leaves on :latest (v1.9.5 is the same code,
  # bar its README). Renovate proposes each upgrade. The e2e job has no NAS
  # to deploy this against, so CI only renders and validates them.
  #
  # Every controller/node-plugin container is unset upstream (BestEffort QoS)
  # — confirmed the first candidates evicted/OOM-killed under real node memory
  # pressure on a live cluster, ahead of far less critical pods. These are
  # small, conservative defaults (each container is a thin gRPC sidecar, not
  # itself I/O- or CPU-heavy) — override per-consumer via
  # storageProvisionerHelmValues if a specific backend needs more headroom.
  controller:
    externalAttacher:
      image:
        registry: registry.k8s.io/sig-storage/csi-attacher
        # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-attacher
        tag: v4.4.0
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    externalProvisioner:
      image:
        registry: registry.k8s.io/sig-storage/csi-provisioner
        # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-provisioner
        tag: v3.6.0
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    externalResizer:
      image:
        registry: registry.k8s.io/sig-storage/csi-resizer
        # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-resizer
        tag: v1.9.0
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    externalSnapshotter:
      image:
        registry: registry.k8s.io/sig-storage/csi-snapshotter
        # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.2.1
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    driver:
      image:
        registry: ghcr.io/democratic-csi/democratic-csi
        # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
        tag: v1.9.5
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 200m, memory: 256Mi}
  node:
    driver:
      image:
        registry: ghcr.io/democratic-csi/democratic-csi
        # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
        tag: v1.9.5
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 200m, memory: 256Mi}
    driverRegistrar:
      image:
        registry: registry.k8s.io/sig-storage/csi-node-driver-registrar
        # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.9.0
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    cleanup:
      image:
        registry: docker.io/busybox
        # renovate: datasource=docker depName=docker.io/busybox
        tag: 1.37.0
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
  csiProxy:
    image:
      registry: ghcr.io/democratic-csi/csi-grpc-proxy
      # renovate: datasource=docker depName=ghcr.io/democratic-csi/csi-grpc-proxy
      tag: v0.5.7
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
