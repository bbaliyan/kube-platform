# Generic democratic-csi scaffold — no backend (TrueNAS or otherwise) is
# specific to this chart. Everything below is genuinely consumer-specific
# (which NAS/SAN, its connection details, dataset layout) and MUST be
# supplied per-cluster via platform_extra_helm_parameters /
# platform_helm_values_object in the consumer repo — never filled in here.
#
# Nested under "democratic-csi" because that's the Helm dependency's release
# name (values for a subchart must be namespaced under it, not top-level —
# same pattern as aws-ebs's values being nested under aws-ebs-csi-driver).
#
# democratic-csi.driver.config holds the full backend driver config (see
# https://github.com/democratic-csi/democratic-csi/tree/master/examples for
# the shape per backend, e.g. freenas-api-iscsi for TrueNAS over iSCSI).
# Secrets (API keys/passwords) inside it must never be set directly in
# git-tracked values — use driver.existingConfigSecret to point at a secret
# created out-of-band instead, and leave driver.config.driver as the only
# key set here (the chart needs it even when existingConfigSecret is used).
democratic-csi:
  driver:
    existingConfigSecret: ""
    config:
      driver: ""

  csiDriver:
    name: ""

  storageClasses: []

  # Every controller/node-plugin container is unset upstream (BestEffort QoS)
  # — confirmed the first candidates evicted/OOM-killed under real node memory
  # pressure on a live cluster, ahead of far less critical pods. These are
  # small, conservative defaults (each container is a thin gRPC sidecar, not
  # itself I/O- or CPU-heavy) — override per-consumer via
  # storageProvisionerHelmValues if a specific backend needs more headroom.
  controller:
    externalAttacher:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    externalProvisioner:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    externalResizer:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    externalSnapshotter:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    driver:
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 200m, memory: 256Mi}
  node:
    driver:
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 200m, memory: 256Mi}
    driverRegistrar:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    cleanup:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
  csiProxy:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
